<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JMTWEAKS - Your License</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}
    .card{width:min(620px,92%);padding:40px;text-align:center;background:#151b23;border-radius:16px;box-sizing:border-box}
    h1{margin-top:0}.key{margin:25px 0;padding:18px;background:#0b0f14;border-radius:10px;font-size:22px;font-weight:bold;letter-spacing:1px;word-break:break-all}
    .note{color:#aeb7c4;line-height:1.6}button{padding:12px 20px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.error{color:#ff8b8b}
  </style>
</head>
<body>
  <div class="card">
    <h1>JMTWEAKS Pro</h1>
    <p id="status">Retrieving your license...</p>
    <div class="key" id="license">Please wait...</div>
    <button id="copy" onclick="copyKey()" style="display:none;">Copy License Key</button>
    <p class="note">Save this key somewhere safe. Enter it in JMTWEAKS to activate your lifetime Pro license.</p>
  </div>
  <script>
    const API="https://jmtweaks-license.jmbsblszn.workers.dev/license";
    const sessionId=new URLSearchParams(window.location.search).get("session_id");
    let licenseKey="";
    async function loadLicense(){
      const status=document.getElementById("status"),box=document.getElementById("license"),copy=document.getElementById("copy");
      if(!sessionId){status.textContent="We could not find your payment session.";box.textContent="Missing session ID.";box.className="key error";return;}
      try{
        const response=await fetch(API+"?session_id="+encodeURIComponent(sessionId));
        const data=await response.json();
        if(!response.ok||!data.ready||!data.license_key){
          status.textContent="Your payment was received, but your license is still being created.";
          box.textContent="Please refresh this page in a few seconds.";box.className="key error";return;
        }
        licenseKey=data.license_key;
        status.textContent="Your payment was successful. Your lifetime Pro license is ready.";
        box.textContent=licenseKey;copy.style.display="inline-block";
      }catch(e){status.textContent="We couldn't reach the license server.";box.textContent="Please refresh the page.";box.className="key error";}
    }
    function copyKey(){if(licenseKey) navigator.clipboard.writeText(licenseKey).then(()=>alert("License key copied."));}
    loadLicense();
  </script>
</body>
</html>
