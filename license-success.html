<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JMTWEAKS - Your License</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#fff;font-family:Arial,sans-serif}.card{width:min(600px,90%);padding:40px;text-align:center;background:#151b23;border-radius:16px;box-sizing:border-box}h1{margin-top:0}.key{margin:25px 0;padding:18px;background:#0b0f14;border-radius:10px;font-size:22px;font-weight:bold;letter-spacing:1px;word-break:break-all}.note{color:#aeb7c4;line-height:1.6}button{padding:12px 20px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
</style></head>
<body><div class="card"><h1>JMTWEAKS Pro</h1><p>Your payment was successful.</p><div class="key" id="license">Loading your license...</div><button onclick="copyKey()">Copy License Key</button><p class="note">Save this key somewhere safe. Enter it in JMTWEAKS to activate your lifetime Pro license.</p></div>
<script>const params=new URLSearchParams(window.location.search);const key=params.get("license_key");document.getElementById("license").textContent=key||"Your license key was not included in the link.";function copyKey(){if(!key)return;navigator.clipboard.writeText(key);alert("License key copied.");}</script>
</body></html>
